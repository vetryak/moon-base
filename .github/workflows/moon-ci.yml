# CI base com moon: roda apenas as tarefas dos projetos afetados pela mudança.
# Repositórios consumidores recebem este arquivo via scripts/adopt.sh.
name: moon-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: moon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # moon precisa do histórico para calcular projetos afetados

      # Instala proto e as ferramentas fixadas no .prototools (moon, node...)
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      # Ferramentas do toolchain "system" usadas pelas tarefas herdadas.
      # Remova o que o repositório não usar.
      - uses: astral-sh/setup-uv@v6

      - run: moon ci
